  # ========== Log retention ==========
  # Explicitly own the log groups so we can set RetentionInDays. Without these,
  # Lambda auto-creates log groups on first invocation with infinite retention.
  # DeletionPolicy: Delete -> logs go away on stack delete (matches expectation).
  QuotaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-handler'
      RetentionInDays: 30
      KmsKeyId: !GetAtt ProjectKey.Arn

  DeployerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-deployer'
      RetentionInDays: 30
      KmsKeyId: !GetAtt ProjectKey.Arn


  # ========== CloudFront WAF (Tier 3, cross-region custom resource) ==========
  # Creates/updates/deletes a CLOUDFRONT-scoped WAFv2 WebACL in us-east-1
  # regardless of which region the rest of the stack is in.
  CloudFrontWafLambdaRole:
    Condition: ShouldCreateCloudFrontWaf
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageCloudFrontWaf
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # WAFv2 management for CloudFront-scoped ACLs (must be us-east-1).
              # Specific ARNs aren't possible at policy-write time because the
              # WebACL Id is generated; scope to the global CLOUDFRONT region.
              - Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListWebACLs
                  - wafv2:TagResource
                  - wafv2:UntagResource
                Resource:
                  - !Sub 'arn:aws:wafv2:us-east-1:${AWS::AccountId}:global/webacl/*'
                  - !Sub 'arn:aws:wafv2:us-east-1:${AWS::AccountId}:global/managedruleset/*/*'

  CloudFrontWafLambdaLogGroup:
    Condition: ShouldCreateCloudFrontWaf
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-cf-waf'
      RetentionInDays: 30
      KmsKeyId: !GetAtt ProjectKey.Arn

  CloudFrontWafLambda:
    Condition: ShouldCreateCloudFrontWaf
    Type: AWS::Lambda::Function
    DependsOn: CloudFrontWafLambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-cf-waf'
      TracingConfig:
        Mode: Active
      ReservedConcurrentExecutions: 2
      Runtime: python3.12
      Handler: index.handler
      Timeout: 90
      Role: !GetAtt CloudFrontWafLambdaRole.Arn
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: Apache-2.0
          import boto3, json, time, urllib.request

          waf = boto3.client('wafv2', region_name='us-east-1')

          def _rules(name):
            return [
              {
                'Name': 'AWS-AWSManagedRulesKnownBadInputsRuleSet',
                'Priority': 0,
                'OverrideAction': {'None': {}},
                'Statement': {'ManagedRuleGroupStatement': {
                  'VendorName': 'AWS', 'Name': 'AWSManagedRulesKnownBadInputsRuleSet'}},
                'VisibilityConfig': {
                  'SampledRequestsEnabled': True, 'CloudWatchMetricsEnabled': True,
                  'MetricName': 'CF-KnownBadInputs'},
              },
              {
                'Name': 'AWS-AWSManagedRulesCommonRuleSet',
                'Priority': 1,
                'OverrideAction': {'None': {}},
                'Statement': {'ManagedRuleGroupStatement': {
                  'VendorName': 'AWS', 'Name': 'AWSManagedRulesCommonRuleSet'}},
                'VisibilityConfig': {
                  'SampledRequestsEnabled': True, 'CloudWatchMetricsEnabled': True,
                  'MetricName': 'CF-CommonRuleSet'},
              },
              {
                'Name': 'RateLimitPerIP',
                'Priority': 2,
                'Action': {'Block': {}},
                'Statement': {'RateBasedStatement': {
                  'Limit': 1000, 'AggregateKeyType': 'IP'}},
                'VisibilityConfig': {
                  'SampledRequestsEnabled': True, 'CloudWatchMetricsEnabled': True,
                  'MetricName': 'CF-RateLimit'},
              },
            ]

          def _send(event, status, data=None, physical_id=None, reason=None):
            body = json.dumps({
              'Status': status,
              'Reason': reason or 'See CloudWatch logs',
              'PhysicalResourceId': physical_id or event.get('PhysicalResourceId') or 'cfwaf-init',
              'StackId': event['StackId'],
              'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'],
              'NoEcho': False,
              'Data': data or {},
            }).encode()
            req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                                          headers={'Content-Type': '', 'Content-Length': str(len(body))})
            urllib.request.urlopen(req).read()  # nosec B310 - CFN response URL, not user-controlled

          def handler(event, context):
            try:
              op = event['RequestType']
              name = event['ResourceProperties']['Name']
              if op == 'Create':
                r = waf.create_web_acl(
                  Name=name, Scope='CLOUDFRONT',
                  DefaultAction={'Allow': {}},
                  VisibilityConfig={
                    'SampledRequestsEnabled': True, 'CloudWatchMetricsEnabled': True,
                    'MetricName': name.replace('-', '_')[:128],
                  },
                  Rules=_rules(name))
                arn = r['Summary']['ARN']
                pid = f"{name}|{r['Summary']['Id']}"
                _send(event, 'SUCCESS', {'WebACLArn': arn, 'WebACLId': r['Summary']['Id']},
                      physical_id=pid)
              elif op == 'Update':
                # Find the existing WebACL by physical id (name|id)
                pid = event['PhysicalResourceId']
                if '|' in pid:
                  _name, wid = pid.split('|', 1)
                else:
                  _name, wid = name, pid
                cur = waf.get_web_acl(Name=_name, Scope='CLOUDFRONT', Id=wid)
                waf.update_web_acl(
                  Name=_name, Scope='CLOUDFRONT', Id=wid,
                  LockToken=cur['LockToken'],
                  DefaultAction={'Allow': {}},
                  VisibilityConfig={
                    'SampledRequestsEnabled': True, 'CloudWatchMetricsEnabled': True,
                    'MetricName': _name.replace('-', '_')[:128],
                  },
                  Rules=_rules(_name))
                arn = cur['WebACL']['ARN']
                _send(event, 'SUCCESS', {'WebACLArn': arn, 'WebACLId': wid}, physical_id=pid)
              elif op == 'Delete':
                pid = event['PhysicalResourceId']
                if pid and pid != 'cfwaf-init' and '|' in pid:
                  _name, wid = pid.split('|', 1)
                  for _ in range(20):  # CloudFront takes a while to release the association
                    try:
                      cur = waf.get_web_acl(Name=_name, Scope='CLOUDFRONT', Id=wid)
                      waf.delete_web_acl(Name=_name, Scope='CLOUDFRONT', Id=wid,
                                          LockToken=cur['LockToken'])
                      break
                    except waf.exceptions.WAFAssociatedItemException:
                      time.sleep(15)
                    except waf.exceptions.WAFNonexistentItemException:
                      break
                _send(event, 'SUCCESS', physical_id=pid)
              else:
                _send(event, 'FAILED', reason=f'Unknown RequestType: {op}')
            except Exception as e:
              _send(event, 'FAILED', reason=f'{type(e).__name__}: {e}')

  CloudFrontWebACL:
    Condition: ShouldCreateCloudFrontWaf
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CloudFrontWafLambda.Arn
      Name: !Sub '${AWS::StackName}-cf-acl'


  # ========== API Gateway access log group (request-level access logs) ==========
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access'
      RetentionInDays: 30
      KmsKeyId: !GetAtt ProjectKey.Arn

  # ========== WAFv2 (regional) logging ==========
  # Log group name MUST start with 'aws-waf-logs-' for WAF to deliver to it.
  WafRegionalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-${AWS::StackName}-regional'
      RetentionInDays: 30
      KmsKeyId: !GetAtt ProjectKey.Arn

  WafRegionalLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt QuotaApiWebACL.Arn
      LogDestinationConfigs:
        - !GetAtt WafRegionalLogGroup.Arn
      LoggingFilter:
        DefaultBehavior: KEEP
        Filters:
          - Behavior: KEEP
            Conditions:
              - ActionCondition: { Action: BLOCK }
            Requirement: MEETS_ANY

Outputs:
  SiteURL:
    Value: !Sub 'https://${Distribution.DomainName}'
    Description: CloudFront URL for the tool
  ApiEndpoint:
    Value: !Sub 'https://${QuotaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/quota'
    Description: API Gateway endpoint
  BucketName:
    Value: !Ref ToolBucket
    Description: S3 bucket hosting the static site
  DistributionId:
    Value: !Ref Distribution
    Description: CloudFront distribution ID (for cache invalidation)
  UserPoolId:
    Value: !Ref UserPool
    Description: Cognito User Pool ID (admin creates users here)
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID (used by the browser)
  IdentityPoolId:
    Value: !Ref IdentityPool
    Description: Cognito Identity Pool ID
  AuthRoleArn:
    Value: !GetAtt AuthRole.Arn
    Description: IAM role assumed by signed-in users; only execute-api on this API
  CreateUserCmd:
    Value: !Sub 'aws cognito-idp admin-create-user --user-pool-id ${UserPool} --username USERNAME --temporary-password TEMP_PW --message-action SUPPRESS --region ${AWS::Region}'
    Description: Run this command (substituting USERNAME and TEMP_PW) to create a user
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Description: SNS topic for CloudWatch alarms (subscribe additional consumers here).
  CloudFrontWebACLArn:
    Condition: ShouldCreateCloudFrontWaf
    Value: !GetAtt CloudFrontWebACL.WebACLArn
    Description: ARN of the CLOUDFRONT-scoped WAF WebACL (lives in us-east-1).
  LogsBucketName:
    Value: !Ref LogsBucket
    Description: Bucket holding CloudFront standard logs and S3 server access logs.
  ProjectKeyArn:
    Value: !GetAtt ProjectKey.Arn
    Description: KMS CMK encrypting CloudWatch Logs and Lambda env vars.
  ApiAccessLogGroupName:
    Value: !Ref ApiAccessLogGroup
    Description: CloudWatch Logs group for API Gateway access logs.
  WafRegionalLogGroupName:
    Value: !Ref WafRegionalLogGroup
    Description: CloudWatch Logs group for regional WAFv2 BLOCK events.
