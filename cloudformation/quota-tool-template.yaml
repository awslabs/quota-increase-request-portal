AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Request Portal for AWS Service Quotas, fully self-contained.
  S3 static site + CloudFront + API Gateway + Lambda backend.
  Deploys HTML automatically via custom resource. No external dependencies.

Parameters:
  ToolBucketName:
    Type: String
    Default: quota-increase-tool
    Description: S3 bucket name prefix (account ID appended automatically)

  AlarmEmail:
    Type: String
    Default: ''
    Description: Email to receive CloudWatch alarm notifications (leave blank to disable email subscription).

  GeoAllowList:
    Type: CommaDelimitedList
    Default: 'US'
    Description: ISO 3166-1 alpha-2 country codes (comma-separated) allowed to access the CloudFront site. Default US-only.

  EnableApiGwExecutionLogs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable API Gateway execution logging at ERROR level. Requires AWS::ApiGateway::Account (a regional singleton); set to 'false' if another stack already manages that resource in this region.

  EnableAdvancedSecurity:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable Cognito User Pool advanced security (compromised-credentials check + adaptive auth). Charged at $0.05/MAU above the free tier (Cognito Plus pricing).

  AdvancedSecurityMode:
    Type: String
    Default: 'AUDIT'
    AllowedValues: ['AUDIT', 'ENFORCED']
    Description: Cognito advanced security mode. AUDIT logs risk events but does not block; ENFORCED blocks high-risk sign-ins. Start with AUDIT, then escalate after observing the metrics.

  MfaConfiguration:
    Type: String
    Default: 'ON'
    AllowedValues: ['OFF', 'OPTIONAL', 'ON']
    Description: Cognito User Pool MFA setting. OPTIONAL allows existing users to keep working; ON requires every user to enroll in TOTP on next sign-in.

  UserPoolDeletionProtection:
    Type: String
    Default: 'ACTIVE'
    AllowedValues: ['ACTIVE', 'INACTIVE']
    Description: Whether the Cognito User Pool resists deletion. Set to INACTIVE during teardown to allow stack delete.

  EnableCloudFrontWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Attach a CLOUDFRONT-scoped WAFv2 WebACL to the distribution. The WebACL is created in us-east-1 by a custom resource (works from any deployment region).

  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional CNAME for the CloudFront distribution (e.g. quota.example.com). Leave blank to use the default *.cloudfront.net hostname (TLSv1+ minimum, controlled by AWS). With a custom domain, MinimumProtocolVersion is enforced to TLSv1.2_2021.

  ACMCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN (must be in us-east-1) for CustomDomainName. Required when CustomDomainName is set; ignored otherwise.

Conditions:
  HasAlarmEmail:               !Not [!Equals [!Ref AlarmEmail, '']]
  ShouldEnableApiGwLogging:    !Equals [!Ref EnableApiGwExecutionLogs, 'true']
  ShouldEnableAdvancedSecurity: !Equals [!Ref EnableAdvancedSecurity, 'true']
  ShouldCreateCloudFrontWaf:   !Equals [!Ref EnableCloudFrontWaf, 'true']
  HasCustomDomain:             !Not [!Equals [!Ref CustomDomainName, '']]

Resources:

  # ========== Project KMS key (encrypts CW Logs + Lambda env vars) ==========
  ProjectKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'Project CMK for ${AWS::StackName} (CW Logs, Lambda env vars, S3 SSE)'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRoot
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.amazonaws.com' }
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action:
              - kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

  ProjectKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-key'
      TargetKeyId: !Ref ProjectKey

  # ========== S3 Static Hosting ==========

  # ========== Logs bucket (CloudFront + S3 access logs) ==========
  # Separate bucket so log retention and access controls are independent of the
  # tool's content. This template uses CloudFront *legacy* access logging
  # (DistributionConfig.Logging, below), whose log-delivery writer requires ACLs
  # on the destination bucket — hence ObjectOwnership=BucketOwnerPreferred (not
  # BucketOwnerEnforced). Public ACLs are still blocked by PublicAccessBlock.
  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Self-logging would recurse; this IS the access-log destination bucket."
    Properties:
      BucketName: !Sub '${ToolBucketName}-logs-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred  # CloudFront writer needs ACL
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  ToolBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ToolBucketName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt ProjectKey.Arn
            BucketKeyEnabled: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  ToolBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ToolBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ToolBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ToolBucket.Arn
              - !Sub '${ToolBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Logs bucket has no allow statements (writes are ACL-based via legacy CloudFront
  # log delivery); this policy only enforces TLS-in-transit on any access.
  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub '${LogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ========== CloudFront ==========
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Logging:
          Bucket: !GetAtt LogsBucket.RegionalDomainName
          Prefix: cloudfront/
          IncludeCookies: false
        DefaultRootObject: index.html
        WebACLId: !If [ShouldCreateCloudFrontWaf, !GetAtt CloudFrontWebACL.WebACLArn, !Ref AWS::NoValue]
        Restrictions:
          GeoRestriction:
            RestrictionType: whitelist
            Locations: !Ref GeoAllowList
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ToolBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          AllowedMethods: [GET, HEAD]
          Compress: true
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref ACMCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # ========== API Gateway execution logs (Tier 3, opt-in) ==========
  # AWS::ApiGateway::Account is a REGIONAL SINGLETON; only one stack per region
  # may own it. Set EnableApiGwExecutionLogs=false if another stack already owns
  # this resource in this region.
  ApiGwCloudWatchRole:
    Condition: ShouldEnableApiGwLogging
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGwAccount:
    Condition: ShouldEnableApiGwLogging
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGwCloudWatchRole.Arn

  # ========== Alarm topic (Tier 3) ==========
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      DisplayName: !Sub '${AWS::StackName} alarms'
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Condition: HasAlarmEmail
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlarmTopic

  # ========== CloudWatch alarms (Tier 3) ==========
  # Spikes in 4XX from the API can indicate sign-in attacks (sigv4 failures land
  # here as 403) or validation failures from a bad client. Threshold tuned high
  # enough to ignore the occasional misfire and low enough to catch sustained
  # abuse. All alarms publish to AlarmTopic; if AlarmEmail is set, you get email.
  Api4XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-4xx'
      AlarmDescription: API Gateway 4XX rate is sustained above 50 / 5 min — possible auth failures or attack.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${AWS::StackName}-api'
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions:    [!Ref AlarmTopic]

  Api5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-5xx'
      AlarmDescription: API Gateway 5XX errors — handler exceptions, timeouts, or upstream failures.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${AWS::StackName}-api'
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions:    [!Ref AlarmTopic]

  HandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-handler-errors'
      AlarmDescription: Quota handler Lambda errors — exceptions, validation failures, or AWS API errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-handler'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions:    [!Ref AlarmTopic]

  HandlerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-handler-throttles'
      AlarmDescription: Quota handler Lambda throttled — concurrency limit reached. Any throttle is suspicious.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-handler'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions:    [!Ref AlarmTopic]

  WafBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-waf-blocked'
      AlarmDescription: WAFv2 BlockedRequests sustained > 100 / 5 min — attack in progress, or rate limit actively engaged.
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub '${AWS::StackName}-api-acl'
        - Name: Region
          Value: !Ref AWS::Region
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions:    [!Ref AlarmTopic]

  # ========== WAFv2 (REGIONAL, attached to API GW prod stage) ==========
  QuotaApiWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-api-acl'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-api-acl'
      Rules:
        # AWS Managed: catches known-bad payloads (Log4j, CVE patterns, scanners, etc.)
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-KnownBadInputs
        # AWS Managed: general OWASP-style protections (XSS, SQLi heuristics, large bodies, etc.)
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-CommonRuleSet
        # Per-source-IP rate limit. 1000 req / 5 min is far above interactive use
        # (the API GW stage throttle is 20 rps = 6000 / 5 min across all IPs).
        - Name: RateLimitPerIP
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP

  QuotaApiWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${QuotaApi}/stages/${ApiStage}'
      WebACLArn: !GetAtt QuotaApiWebACL.Arn

  # ========== CloudFront security headers ==========
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            # script-src: 'self' + per-script SHA-256 hashes. All inline event
            # handlers (onclick=, onchange=) were removed in v3.11 in favour of
            # data-* attributes + a single delegated listener. style-src keeps
            # 'unsafe-inline' so the existing inline <style>/style="" attributes
            # continue to work — XSS via styles is much less dangerous and
            # converting them is a separate large refactor.
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'sha256-9I1Izb7vIYrYk1xQki7JbMc40hRCwx7ARJxCQS2B0/4=' 'sha256-oxLT0d7l48h4+nFmSrHbs2ldx6TKLKJtv4PvQCb4vsw='; style-src 'self' 'sha256-YVyR5xJtk2KiMeBY0DdjDwDkd1kRIle1muoA/CQnqW0=' 'sha256-nlove6I6d9oOi4SnO/zRZEv3/LRfD9/eI/R5tT7kqRA=' 'sha256-u0Glr5Dw4Lg5YoxXcBmKVCKt8I0kldvyTEntFAKWZ5g='; img-src 'self' data:; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://cognito-identity.${AWS::Region}.amazonaws.com https://${QuotaApi}.execute-api.${AWS::Region}.amazonaws.com; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  # ========== Lambda Backend ==========
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QuotaToolPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Service Quotas read-only (handler reads quotas; case submission
                  # is via Support API, not Service Quotas RequestServiceQuotaIncrease).
                  - servicequotas:ListServices
                  - servicequotas:ListServiceQuotas
                  - servicequotas:ListAWSDefaultServiceQuotas
                  - servicequotas:GetServiceQuota
                  - servicequotas:GetAWSDefaultServiceQuota
                  # Support API: case create/describe + attachments
                  - support:CreateCase
                  - support:DescribeCases
                  - support:AddAttachmentsToSet
                  # EC2 region listing
                  - ec2:DescribeRegions
                Resource: '*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt ProjectKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  QuotaFunction:
    Type: AWS::Lambda::Function
    DependsOn: QuotaFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-handler'
      TracingConfig:
        Mode: Active
      ReservedConcurrentExecutions: 20
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaRole.Arn
      KmsKeyArn: !GetAtt ProjectKey.Arn
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Sub 'https://${Distribution.DomainName}'
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: Apache-2.0
          import json, os, re, boto3

          ALLOWED_ORIGIN = os.environ.get('ALLOWED_ORIGIN', '*')
          HEADERS = {
            'Content-Type': 'application/json',
            'Access-Control-Allow-Origin': ALLOWED_ORIGIN,
            'Access-Control-Allow-Methods': 'POST,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type, Authorization, X-Amz-Date, X-Amz-Security-Token, X-Amz-Content-Sha256',
            'Vary': 'Origin',
          }

          # ========== Input validation ==========
          MAX_BODY_BYTES   = 256 * 1024   # 256 KB request body cap (covers attachments + JSON overhead)
          MAX_TEXT_CHARS   = 8000         # justification, etc.
          MAX_NAME_CHARS   = 256          # serviceName, quotaName
          MAX_REGIONS      = 50           # max regions per submit
          MAX_ATTACHMENTS  = 3            # Support API allows 3 attachments
          MAX_ATTACH_BYTES = 5 * 1024 * 1024  # 5 MB total per attachment set (Support API limit)
          VALID_ACTIONS    = {'submit', 'lookup', 'list-quotas', 'list-services', 'list-regions'}
          VALID_URGENCY    = {'low', 'normal', 'high'}
          RE_SERVICE       = re.compile(r'^[a-z0-9-]{1,64}$')
          RE_QUOTA_CODE    = re.compile(r'^L-[A-Za-z0-9]{8}$')
          RE_ITEM_CODE     = re.compile(r'^[a-z0-9-]{1,128}$')
          RE_REGION        = re.compile(r'^[a-z]{2}-[a-z]+-\d{1,2}$')
          RE_FILENAME      = re.compile(r'^[A-Za-z0-9_.\- ]{1,200}$')   # no path separators

          class BadInput(Exception): pass

          def _validate(body):
            """Sanity-check input fields. Raises BadInput on validation failure."""
            if not isinstance(body, dict): raise BadInput('body must be an object')
            a = body.get('action', 'submit')
            if a not in VALID_ACTIONS: raise BadInput(f'unknown action: {a!r}')
            for k in ('service', 'itemCode'):
              v = body.get(k, '')
              if v and (not isinstance(v, str) or not (RE_SERVICE if k=='service' else RE_ITEM_CODE).match(v)):
                raise BadInput(f'{k}: invalid format')
            qc = body.get('quotaCode', '')
            if qc and (not isinstance(qc, str) or not RE_QUOTA_CODE.match(qc)):
              raise BadInput('quotaCode: must match L-XXXXXXXX')
            r = body.get('region', '')
            if r and (not isinstance(r, str) or not RE_REGION.match(r)):
              raise BadInput('region: invalid format')
            rs = body.get('regions', None)
            if rs is not None:
              # 'regions' for list-quotas is a list[str]; for submit it's a dict[region->desired]
              if isinstance(rs, list):
                if len(rs) > MAX_REGIONS: raise BadInput('regions: too many')
                for x in rs:
                  if not isinstance(x, str) or not RE_REGION.match(x): raise BadInput('regions: bad entry')
              elif isinstance(rs, dict):
                if len(rs) > MAX_REGIONS: raise BadInput('regions: too many')
                for k, v in rs.items():
                  if not isinstance(k, str) or not RE_REGION.match(k): raise BadInput(f'regions[{k}]: bad key')
                  if not isinstance(v, (int, float, str)) or len(str(v)) > 64: raise BadInput(f'regions[{k}]: bad value')
              else:
                raise BadInput('regions: must be list or dict')
            for k in ('serviceName', 'quotaName'):
              v = body.get(k, '')
              if v and (not isinstance(v, str) or len(v) > MAX_NAME_CHARS):
                raise BadInput(f'{k}: too long (>{MAX_NAME_CHARS})')
            j = body.get('justification', '')
            if j and (not isinstance(j, str) or len(j) > MAX_TEXT_CHARS):
              raise BadInput(f'justification: too long (>{MAX_TEXT_CHARS})')
            u = body.get('urgency', 'normal')
            if u not in VALID_URGENCY: raise BadInput('urgency: must be low/normal/high')
            atts = body.get('attachments', [])
            if atts:
              if not isinstance(atts, list) or len(atts) > MAX_ATTACHMENTS:
                raise BadInput(f'attachments: max {MAX_ATTACHMENTS}')
              total = 0
              for a in atts:
                if not isinstance(a, dict) or 'fileName' not in a or 'data' not in a:
                  raise BadInput('attachments: each must have fileName and data')
                if not isinstance(a['fileName'], str) or not RE_FILENAME.match(a['fileName']):
                  raise BadInput('attachments.fileName: invalid (no path separators, max 200 chars)')
                if not isinstance(a['data'], str): raise BadInput('attachments.data: must be base64 string')
                # Approximate decoded size from base64 length
                total += (len(a['data']) * 3) // 4
                if total > MAX_ATTACH_BYTES:
                  raise BadInput(f'attachments: total decoded size exceeds {MAX_ATTACH_BYTES} bytes')


